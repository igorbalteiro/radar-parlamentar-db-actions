name: Coletar Dados Câmara

on:
  schedule:
    - cron: '0 6 * * *'      # Diariamente às 06h UTC (despesas + métricas + emendas)
    - cron: '0 8 * * 6'      # Sábados às 08h UTC (deputados + presenças)
  workflow_dispatch:
    inputs:
      script_selecionado:
        description: 'Qual script deseja rodar?'
        required: true
        default: 'todos'
        type: choice
        options:
          - todos
          - deputados
          - despesas
          - metricas
          - emendas
          - presencas

jobs:
  coletar_despesas:
    name: Coleta diária (despesas)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: |
      (github.event_name == 'schedule' && github.event.schedule == '0 6 * * *') ||
      (github.event_name == 'workflow_dispatch' && (
        github.event.inputs.script_selecionado == 'todos' ||
        github.event.inputs.script_selecionado == 'despesas'
      ))

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Executar coleta (Despesas)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python scripts/coletar_despesas.py

  coletar_metricas:
    name: Coleta diária (métricas)
    runs-on: ubuntu-latest
    needs: coletar_despesas
    timeout-minutes: 60
    if: |
      always() && (
        (github.event_name == 'schedule' && needs.coletar_despesas.result == 'success' && github.event.schedule == '0 6 * * *') ||
      (github.event_name == 'workflow_dispatch' && (
        github.event.inputs.script_selecionado == 'todos' ||
        github.event.inputs.script_selecionado == 'metricas'
      )))

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Executar coleta (Metricas)
        if: |
          github.event_name == 'schedule' ||
          github.event.inputs.script_selecionado == 'todos' ||
          github.event.inputs.script_selecionado == 'metricas'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python scripts/coletar_metricas.py

  coletar_emendas:
    name: Coleta diária (emendas)
    runs-on: ubuntu-latest
    # Uma página pode ficar em preparação no portal por alguns minutos.
    timeout-minutes: 60
    if: |
      (github.event_name == 'schedule' && github.event.schedule == '0 6 * * *') ||
      (github.event_name == 'workflow_dispatch' && (
        github.event.inputs.script_selecionado == 'todos' ||
        github.event.inputs.script_selecionado == 'emendas'
      ))

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Executar coleta (Emendas)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python scripts/coletar_emendas.py

  notificar:
    name: Enviar notificações
    runs-on: ubuntu-latest
    needs: coletar_metricas
    if: |
      always() && needs.coletar_metricas.result == 'success' && (
        github.event_name == 'schedule' ||
        github.event.inputs.script_selecionado == 'todos' ||
        github.event.inputs.script_selecionado == 'metricas'
      )

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Executar notificações
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python scripts/notificar.py

  coletar_deputados:
    name: Coleta semanal (deputados)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: |
      (github.event_name == 'schedule' && github.event.schedule == '0 8 * * 6') ||
      (github.event_name == 'workflow_dispatch' && (
        github.event.inputs.script_selecionado == 'todos' ||
        github.event.inputs.script_selecionado == 'deputados'
      ))

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Executar coleta (Deputados)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          PYTHONUNBUFFERED: "1"
        run: python -u scripts/coletar_deputados.py

  coletar_presencas:
    name: Coleta semanal (presenças)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: |
      (github.event_name == 'schedule' && github.event.schedule == '0 8 * * 6') ||
      (github.event_name == 'workflow_dispatch' && (
        github.event.inputs.script_selecionado == 'todos' ||
        github.event.inputs.script_selecionado == 'presencas'
      ))

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Executar coleta (Presenças)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          PYTHONUNBUFFERED: "1"
        run: python -u scripts/coletar_presencas.py
